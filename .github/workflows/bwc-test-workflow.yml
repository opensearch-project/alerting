name: BWC Test Workflow
on:
  pull_request:
  push:
    branches:
      - main
      - '*.x'
      - '2.*'
      - '3.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bwc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Alerting BWC (rolling and full restart)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set Up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run Alerting Backwards Compatibility Tests
        run: ./gradlew :alerting:bwcTestSuite --no-daemon --max-workers=2
      - name: Verify every upgrade phase ran tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          phases = [
              "oldVersionClusterTask0", "oldVersionClusterTask1", "mixedClusterTask",
              "twoThirdsUpgradedClusterTask", "rollingUpgradeClusterTask", "fullRestartClusterTask",
          ]
          for phase in phases:
              reports = list(Path(f"alerting/build/test-results/alertingBwcCluster#{phase}").glob("TEST-*.xml"))
              suites = [ET.parse(report).getroot() for report in reports]
              executed = sum(int(s.get("tests", 0)) - int(s.get("skipped", 0)) for s in suites)
              failures = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
              if executed < 2 or failures:
                  raise SystemExit(f"{phase}: expected both BWC tests to pass; executed={executed}, failures={failures}")
              print(f"{phase}: {executed} tests passed")
          PY
      - name: Upload BWC reports and cluster logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alerting-bwc-reports
          path: |
            alerting/build/reports/tests/
            alerting/build/test-results/
            alerting/build/testclusters/**/logs/
