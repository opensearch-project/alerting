name: BWC Test Workflow
# Run on pull requests and pushes to main or release branches, or manually.
on:
  pull_request:
  push:
    branches:
      - main
      - '*.x'
      - '2.*'
      - '3.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bwc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Get-CI-Image-Tag:
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@main
    with:
      product: opensearch

  build-linux:
    needs: Get-CI-Image-Tag
    name: Alerting BWC (rolling and full restart)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # Use the same image as the OpenSearch distribution build.
      # The shared workflow supplies the current image tag and startup options.
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      # Start as root so GitHub Actions can initialize the container.
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}

    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}
      - name: Checkout Branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set Up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run Alerting Backwards Compatibility Tests
        run: |
          # OpenSearch cannot start as root; run the tests as the image's build user.
          chown -R 1000:1000 "$PWD"
          su "$(id -un 1000)" -c './gradlew :alerting:bwcTestSuite --no-daemon --max-workers=2'
      # Preserve reports and cluster logs even when an upgrade fails.
      - name: Upload BWC reports and cluster logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alerting-bwc-reports
          path: |
            alerting/build/reports/tests/
            alerting/build/test-results/
            alerting/build/testclusters/**/logs/
